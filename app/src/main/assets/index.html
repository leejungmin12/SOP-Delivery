<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOP 배달</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{background:#171717;padding:18px;text-align:center;border-bottom:2px solid #d9ad43}
h1{margin:0;color:#f2c45c;font-size:28px}
header p{margin:5px 0;color:#bbb;font-size:12px}
main{max-width:600px;margin:auto;padding:16px;padding-bottom:85px}
.card{background:#202020;border:1px solid #333;border-radius:15px;padding:17px;margin:13px 0}
h2,h3{color:#f2c45c}
input,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #555;border-radius:9px;background:#292929;color:white;font-size:15px}
button{border:0;border-radius:9px;padding:12px 15px;background:#e8b94e;color:#111;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#444;color:#fff}
.danger{background:#a93b3b;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row button{flex:1}
.item{border-bottom:1px solid #444;padding:12px 0}
.price{color:#f2c45c;font-weight:bold}
.small{font-size:13px;color:#bbb}
.hidden{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#171717;border-top:1px solid #d9ad43;padding:8px;gap:5px}
nav button{flex:1;font-size:12px;padding:12px 3px}
#message{color:#ffd879;white-space:pre-wrap}
.badge{display:inline-block;background:#473a1d;color:#f2c45c;padding:5px 9px;border-radius:20px}
</style>
</head>
<body>

<header>
<h1>🖤 SOP 💛</h1>
<p>SECRET ONE PARTNER · 배달 · 퀵 · 심부름</p>
</header>

<main>
<div id="message"></div>

<section id="loginPage" class="card">
<h2>🔐 회원 로그인</h2>
<input id="email" type="email" placeholder="이메일">
<input id="password" type="password" placeholder="비밀번호">
<div class="row">
<button id="loginBtn">로그인</button>
<button id="signupBtn" class="secondary">회원가입</button>
</div>
<p class="small">Firebase 이메일 계정을 사용합니다.</p>
</section>

<section id="homePage" class="hidden">
<div class="card">
<h2>🏠 SOP 배달앱</h2>
<p id="welcome"></p>
<p class="small">음식 주문과 생활 서비스를 신청하세요.</p>
<div class="row">
<button onclick="showPage('foodPage')">🍔 음식 배달</button>
<button onclick="showPage('servicePage')">🚚 퀵·심부름</button>
</div>
</div>
<div class="card">
<h3>📦 주문 관리</h3>
<p>주문 정보는 Firebase Firestore에 저장됩니다.</p>
<button onclick="openOrders()">내 주문 내역</button>
</div>
</section>

<section id="foodPage" class="hidden">
<h2>🍔 음식 배달</h2>
<div id="foodList"></div>
<button onclick="showPage('cartPage')">🛒 장바구니 보기</button>
</section>

<section id="cartPage" class="hidden">
<h2>🛒 장바구니</h2>
<div class="card">
<div id="cartList"></div>
<h3 id="cartTotal">총 0원</h3>
<input id="foodAddress" placeholder="배달 주소">
<input id="foodPhone" type="tel" placeholder="연락처">
<button id="checkoutBtn" onclick="checkout()">주문하기</button>
</div>
</section>

<section id="servicePage" class="hidden">
<h2>🚚 퀵서비스 · 심부름</h2>
<div class="card">
<div class="row">
<button onclick="setService('퀵서비스')">퀵서비스</button>
<button onclick="setService('심부름')">심부름</button>
</div>
<h3 id="serviceTitle">퀵서비스 신청</h3>
<input id="serviceAddress" placeholder="출발지 또는 요청 주소">
<input id="serviceDestination" placeholder="도착지 또는 상세 위치">
<input id="servicePhone" type="tel" placeholder="연락처">
<textarea id="serviceDetails" rows="4" placeholder="요청 내용을 입력하세요"></textarea>
<p class="small">요금은 담당자 확인 후 안내하는 시연용 화면입니다.</p>
<button id="serviceBtn" onclick="submitService()">신청하기</button>
</div>
</section>

<section id="ordersPage" class="hidden">
<h2>📋 내 주문 내역</h2>
<button onclick="openOrders()">🔄 새로고침</button>
<div id="ordersList"></div>
</section>

<section id="loadingPage" class="card">
<p>Firebase 로그인 상태 확인 중...</p>
</section>
</main>

<nav id="bottomNav" class="hidden">
<button onclick="showPage('homePage')">🏠 홈</button>
<button onclick="showPage('foodPage')">🍔 배달</button>
<button onclick="showPage('cartPage')">🛒 장바구니</button>
<button onclick="openOrders()">📦 주문</button>
<button id="logoutBtn" class="secondary">로그아웃</button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDqB3PZ5SBwo1JrxBSqSFiJByB5o23X_Xg",
authDomain:"sop-delivery.firebaseapp.com",
projectId:"sop-delivery",
storageBucket:"sop-delivery.firebasestorage.app",
messagingSenderId:"169609846426",
appId:"1:169609846426:web:4efbc158d9abeca1214923"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

const $=id=>document.getElementById(id);
const money=n=>Number(n).toLocaleString("ko-KR")+"원";

let currentUser=null;
let cart=[];
let serviceType="퀵서비스";
let busy=false;

const menu=[
{shop:"SOP 치킨",name:"후라이드 치킨",price:19000},
{shop:"SOP 치킨",name:"양념 치킨",price:21000},
{shop:"SOP 피자",name:"치즈 피자",price:18000},
{shop:"SOP 피자",name:"페퍼로니 피자",price:20000},
{shop:"SOP 분식",name:"떡볶이",price:5000},
{shop:"SOP 분식",name:"김밥",price:4000},
{shop:"SOP 분식",name:"튀김",price:5000}
];

function message(text){
$("message").textContent=text||"";
}

function showPage(id){
if(!currentUser&&id!=="loginPage")return;
["loginPage","homePage","foodPage","cartPage","servicePage","ordersPage","loadingPage"]
.forEach(x=>$(x).classList.add("hidden"));
$(id).classList.remove("hidden");
$("bottomNav").classList.toggle("hidden",!currentUser);
message("");
if(id==="foodPage")renderFood();
if(id==="cartPage")renderCart();
}

window.showPage=showPage;

function renderFood(){
const root=$("foodList");
root.replaceChildren();
menu.forEach((item,index)=>{
const box=document.createElement("div");
box.className="card";
const title=document.createElement("h3");
title.textContent=item.shop;
const name=document.createElement("p");
name.textContent=item.name+" · "+money(item.price);
const btn=document.createElement("button");
btn.textContent="장바구니 담기";
btn.onclick=()=>addCart(index);
box.append(title,name,btn);
root.appendChild(box);
});
}

function addCart(index){
const item=menu[index];
const found=cart.find(x=>x.name===item.name&&x.shop===item.shop);
if(found)found.qty++;
else cart.push({...item,qty:1});
alert(item.name+" 장바구니에 담았습니다.");
}

function renderCart(){
const root=$("cartList");
root.replaceChildren();
if(!cart.length){
root.textContent="장바구니가 비어 있습니다.";
}
cart.forEach((item,index)=>{
const row=document.createElement("div");
row.className="item";
const label=document.createElement("p");
label.textContent=item.name+" × "+item.qty+" · "+money(item.price*item.qty);
const minus=document.createElement("button");
minus.textContent="−";
minus.onclick=()=>{
item.qty--;
if(item.qty<=0)cart.splice(index,1);
renderCart();
};
const plus=document.createElement("button");
plus.textContent="+";
plus.onclick=()=>{item.qty++;renderCart();};
const controls=document.createElement("div");
controls.className="row";
controls.append(minus,plus);
row.append(label,controls);
root.appendChild(row);
});
$("cartTotal").textContent="총 "+money(cart.reduce((s,x)=>s+x.price*x.qty,0));
}

async function saveOrder(order){
if(!currentUser)throw new Error("로그인이 필요합니다.");
const data={
userId:currentUser.uid,
items:order.items,
total:order.total,
address:order.address,
phone:order.phone,
status:"접수 대기",
createdAt:serverTimestamp()
};
await addDoc(collection(db,"orders"),data);
}

window.checkout=async function(){
if(busy)return;
if(!cart.length){alert("장바구니가 비어 있습니다.");return;}
const address=$("foodAddress").value.trim();
const phone=$("foodPhone").value.trim();
if(!address||!phone){
alert("배달 주소와 연락처를 입력하세요.");
return;
}
const items=cart.map(x=>({
name:x.name,
shop:x.shop,
price:x.price,
qty:x.qty
}));
const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
busy=true;
$("checkoutBtn").disabled=true;
try{
await saveOrder({items,total,address,phone});
cart=[];
$("foodAddress").value="";
$("foodPhone").value="";
alert("테스트 주문이 Firebase에 저장되었습니다!");
await openOrders();
}catch(e){
alert("주문 저장 실패: "+e.message);
}finally{
busy=false;
$("checkoutBtn").disabled=false;
}
};

window.setService=function(type){
serviceType=type;
$("serviceTitle").textContent=type+" 신청";
};

window.submitService=async function(){
if(busy)return;
const address=$("serviceAddress").value.trim();
const destination=$("serviceDestination").value.trim();
const phone=$("servicePhone").value.trim();
const details=$("serviceDetails").value.trim();
if(!address||!phone||!details){
alert("주소, 연락처, 요청 내용을 입력하세요.");
return;
}
busy=true;
$("serviceBtn").disabled=true;
try{
await saveOrder({
items:[{
name:serviceType,
shop:"SOP 생활 서비스",
price:0,
qty:1,
destination,
details
}],
total:0,
address,
phone
});
$("serviceAddress").value="";
$("serviceDestination").value="";
$("servicePhone").value="";
$("serviceDetails").value="";
alert("테스트 신청이 Firebase에 저장되었습니다!");
await openOrders();
}catch(e){
alert("신청 저장 실패: "+e.message);
}finally{
busy=false;
$("serviceBtn").disabled=false;
}
};

window.openOrders=async function(){
if(!currentUser)return;
showPage("ordersPage");
const root=$("ordersList");
root.textContent="주문 내역을 불러오는 중...";
try{
const q=query(
collection(db,"orders"),
where("userId","==",currentUser.uid)
);
const snap=await getDocs(q);
const orders=snap.docs.map(d=>({id:d.id,...d.data()}));
orders.sort((a,b)=>
(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)
);
root.replaceChildren();
if(!orders.length){
root.textContent="아직 주문 내역이 없습니다.";
return;
}
orders.forEach(order=>{
const card=document.createElement("div");
card.className="card";
const title=document.createElement("h3");
title.textContent="📦 "+order.status;
const date=document.createElement("p");
date.className="small";
date.textContent=order.createdAt?.toDate
?order.createdAt.toDate().toLocaleString("ko-KR")
:"방금 접수";
const details=document.createElement("p");
details.textContent=(order.items||[])
.map(x=>x.name+" × "+x.qty)
.join(", ");
const total=document.createElement("p");
total.className="price";
total.textContent="금액: "+money(order.total);
const address=document.createElement("p");
address.textContent="주소: "+order.address;
card.append(title,date,details,total,address);
root.appendChild(card);
});
}catch(e){
root.textContent="주문 내역 조회 실패: "+e.message;
}
};

$("loginBtn").onclick=async()=>{
try{
await signInWithEmailAndPassword(
auth,$("email").value.trim(),$("password").value
);
}catch(e){alert("로그인 실패: "+e.message);}
};

$("signupBtn").onclick=async()=>{
const email=$("email").value.trim();
const password=$("password").value;
if(!email||password.length<6){
alert("이메일과 6자리 이상의 비밀번호를 입력하세요.");
return;
}
try{
await createUserWithEmailAndPassword(auth,email,password);
alert("회원가입 성공!");
}catch(e){alert("회원가입 실패: "+e.message);}
};

$("logoutBtn").onclick=async()=>{
try{await signOut(auth);}
catch(e){alert("로그아웃 실패: "+e.message);}
};

onAuthStateChanged(auth,user=>{
currentUser=user;
$("loadingPage").classList.add("hidden");
if(user){
$("welcome").textContent=user.email+" 님, 환영합니다!";
showPage("homePage");
}else{
cart=[];
showPage("loginPage");
}
},error=>{
$("loadingPage").classList.add("hidden");
showPage("loginPage");
message("로그인 연결 오류: "+error.message);
});
// ===== SOP 관리자 주문 관리 =====

async function openAdminPage() {
  if (!auth.currentUser) {
    alert("로그인이 필요합니다.");
    return;
  }

  try {
    const { doc, getDoc, getDocs, updateDoc,
            collection, query, orderBy } =
      await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");

    const adminRef = doc(db, "admins", auth.currentUser.uid);
    const adminSnap = await getDoc(adminRef);

    if (!adminSnap.exists() ||
        adminSnap.data().role !== "admin" ||
        adminSnap.data().active !== true) {
      alert("관리자 권한이 없습니다.");
      return;
    }

    const ordersSnap = await getDocs(
      query(collection(db, "orders"), orderBy("createdAt", "desc"))
    );

    let html = `
      <h2>🛠 SOP 관리자 주문 관리</h2>
      <button id="adminBack">← 돌아가기</button>
      <div id="adminOrders"></div>
    `;

    

    document.getElementById("adminBack").onclick = () => location.reload();

    const root = document.getElementById("adminOrders");

    if (ordersSnap.empty) {
      root.textContent = "접수된 주문이 없습니다.";
      return;
    }

    ordersSnap.forEach(orderDoc => {
      const order = orderDoc.data();
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = "주문 상태: " + (order.status || "접수 대기");

      const details = document.createElement("p");
      details.textContent = "주문: " +
        (Array.isArray(order.items)
          ? order.items.map(x => x.name + " × " + x.qty).join(", ")
          : String(order.items || ""));

      const address = document.createElement("p");
      address.textContent = "주소: " + (order.address || "");

      const total = document.createElement("p");
      total.textContent = "금액: " +
        Number(order.total || 0).toLocaleString("ko-KR") + "원";

      const select = document.createElement("select");

      ["접수 대기", "주문 접수", "조리 중",
       "배달 중", "배달 완료", "주문 취소"].forEach(status => {
        const option = document.createElement("option");
        option.value = status;
        option.textContent = status;
        select.appendChild(option);
      });

      select.value = order.status || "접수 대기";

      const button = document.createElement("button");
      button.textContent = "상태 변경 저장";

      button.onclick = async () => {
        try {
          await updateDoc(doc(db, "orders", orderDoc.id), {
            status: select.value
          });
          title.textContent = "주문 상태: " + select.value;
          alert("주문 상태가 변경되었습니다.");
        } catch (error) {
          alert("변경 실패: " + error.message);
        }
      };

      card.append(title, details, address, total, select, button);
      root.appendChild(card);
    });

  } catch (error) {
    alert("관리자 화면 오류: " + error.message);
  }
}

// 관리자 화면 버튼
const adminButton = document.createElement("button");
adminButton.textContent = "🛠 관리자 주문 관리";
adminButton.onclick = openAdminPage;

const homePage = document.getElementById("homePage");
if (homePage) {
  homePage.appendChild(adminButton);
}
</script>
</body>
</html>
