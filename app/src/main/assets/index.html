<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOP 배달</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101014;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  background:#181818;
  padding:35px 20px;
  text-align:center;
}
h1{
  color:#e8b85c;
  font-size:55px;
  margin:0;
}
main{padding:20px}
h2{color:#e8b85c}
.card{
  background:#222;
  padding:20px;
  border-radius:15px;
}
input,button{
  width:100%;
  padding:15px;
  margin:8px 0;
  border-radius:10px;
  font-size:16px;
}
input{
  background:#333;
  color:white;
  border:1px solid #555;
}
button{
  background:#e8b85c;
  color:#111;
  border:0;
  font-weight:bold;
}
button:disabled{opacity:.5}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>

<header>
<h1>SOP</h1>
<p>SECRET ONE PARTNER</p>
<p>시크릿 원 파트너</p>
</header>

<main id="app">
<h2>연결 중...</h2>
<p>Firebase 로그인 서비스를 확인하고 있습니다.</p>
</main>

<script>
const appScreen=document.getElementById("app");

window.addEventListener("error",function(e){
  showError("스크립트 오류: "+(e.message||"파일 로딩 실패"));
});

window.addEventListener("unhandledrejection",function(e){
  showError("연결 오류: "+String(e.reason));
});

function showError(message){
  appScreen.innerHTML="";
  const title=document.createElement("h2");
  title.textContent="연결 오류";
  const detail=document.createElement("p");
  detail.textContent=message;
  appScreen.append(title,detail);
}

setTimeout(function(){
  if(appScreen.textContent.includes("연결 중...")){
    showError("15초 동안 Firebase 응답이 없습니다. 인터넷 연결과 WebView 설정을 확인하세요.");
  }
},15000);
</script>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyDqB3PZ5SBwo1JrxBSqSFiJByB5o23X_Xg",
  authDomain:"sop-delivery.firebaseapp.com",
  projectId:"sop-delivery",
  appId:"1:169609846426:web:4efbc158d9abeca1214923"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const screen=document.getElementById("app");

function loginScreen(){
  screen.innerHTML=`
    <h2>🔐 SOP 로그인</h2>
    <div class="card">
      <input id="email" type="email" placeholder="이메일">
      <input id="password" type="password"
        placeholder="비밀번호 (6자 이상)">
      <button id="login">로그인</button>
      <button id="signup">회원가입</button>
      <p id="message"></p>
    </div>
  `;

  document.getElementById("login").onclick=
    ()=>authenticate(false);
  document.getElementById("signup").onclick=
    ()=>authenticate(true);
}

async function authenticate(isSignup){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const message=document.getElementById("message");

  if(!email||password.length<6){
    message.textContent="이메일과 6자 이상의 비밀번호를 입력하세요.";
    return;
  }

  document.getElementById("login").disabled=true;
  document.getElementById("signup").disabled=true;

  try{
    if(isSignup){
      await createUserWithEmailAndPassword(auth,email,password);
    }else{
      await signInWithEmailAndPassword(auth,email,password);
    }
  }catch(error){
    message.textContent="오류: "+error.code;
    document.getElementById("login").disabled=false;
    document.getElementById("signup").disabled=false;
  }
}

function homeScreen(user){
  screen.innerHTML=`
    <h2>🎉 SOP 로그인 성공!</h2>
    <div class="card">
      <p id="userEmail"></p>
      <p>Firebase 회원 인증이 정상 작동합니다.</p>
      <button id="logout">로그아웃</button>
    </div>
  `;
  document.getElementById("userEmail").textContent=user.email;
  document.getElementById("logout").onclick=()=>signOut(auth);
}

onAuthStateChanged(auth,user=>{
  if(user){
    homeScreen(user);
  }else{
    loginScreen();
  }
},error=>{
  showError("인증 오류: "+error.code);
});
</script>

</body>
</html>
